# Render Blueprint — New + → Blueprint → pick this repo.
services:
  - type: web
    name: deb-portfolio-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS        # e.g. https://debbarman.dev,https://your-site.vercel.app
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL       # the email you signed up to Resend with
        sync: false
      - key: CONTACT_FROM
        value: "Portfolio <onboarding@resend.dev>"
